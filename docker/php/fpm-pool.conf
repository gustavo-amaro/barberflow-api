[www]
user = app
group = app
listen = 127.0.0.1:9000
clear_env = no

; VPS pequena (1 GB): menos filhos evita RAM estourar e fila no socket
pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2

; Libera worker preso (ex.: espera infinita no MySQL) e registra lentidão
request_terminate_timeout = 60s
request_slowlog_timeout = 10s
slowlog = /var/www/var/log/php-fpm-slow.log
