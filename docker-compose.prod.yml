# Barberflow API - Deploy em VPS (~1 GB RAM)
# Serviços: API, MySQL (apenas Barberflow).
# Evolution API fica em outro servidor: use docker-compose.evolution.yml e aponte
# WHATSAPP_EVOLUTION_BASE_URL para a URL pública dessa instância (mesmo EVOLUTION_API_KEY no .env da API).
#
# Uso:
#   1. Crie .env com APP_SECRET, DB_PASSWORD, JWT_PASSPHRASE, etc.
#   2. Gere as chaves JWT em config/jwt/
#   3. docker compose -f docker-compose.prod.yml build
#   4. docker compose -f docker-compose.prod.yml up -d
#   5. docker compose -f docker-compose.prod.yml run --rm api php bin/console doctrine:migrations:migrate --no-interaction

services:
  api:
    image: barberflow-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barberflow_api
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://${DB_USER:-barberflow}:${DB_PASSWORD}@${DB_HOST:-database}:3306/${DB_NAME:-barberflow}?serverVersion=8.0&charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      JWT_TOKEN_TTL: ${JWT_TOKEN_TTL:-3600}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-'^https?://.*$'}
      WHATSAPP_EVOLUTION_BASE_URL: ${WHATSAPP_EVOLUTION_BASE_URL}
    volumes:
      # .env do host (Symfony/console precisa ler)
      - ./.env:/var/www/.env:ro
      # Chaves JWT (geradas na VPS; somente leitura)
      - ./config/jwt:/var/www/config/jwt:ro
      # Uploads de imagens (logo, avatar, etc.) – persiste entre builds
      - barberflow_uploads:/var/www/public/uploads
    networks:
      - barberflow_network

networks:
  barberflow_network:
    driver: bridge

volumes:
  barberflow_uploads:
    driver: local
