# Evolution API (WhatsApp) — servidor dedicado
# Stack: MySQL (banco `evolution`), Redis (cache), Evolution API (porta 8084).
#
# Na VPS da API Barberflow, defina no .env:
#   WHATSAPP_EVOLUTION_BASE_URL=https://evolution.seudominio.com   (ou http://IP:8084)
#   EVOLUTION_API_KEY=<mesma chave que AUTHENTICATION_API_KEY abaixo>
#
# Uso neste servidor:
#   1. Crie .env com EVOLUTION_DB_PASSWORD, EVOLUTION_API_KEY, EVOLUTION_DB_ROOT_PASSWORD, etc.
#   2. docker compose -f docker-compose.evolution.yml up -d
#
# mem_limit: ajuste conforme RAM do host.

services:
  evolution_mysql:
    image: mysql:8.0
    container_name: evolution_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${EVOLUTION_DB_ROOT_PASSWORD:?Defina EVOLUTION_DB_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: evolution
      MYSQL_USER: ${EVOLUTION_DB_USER:-evolution}
      MYSQL_PASSWORD: ${EVOLUTION_DB_PASSWORD:?Defina EVOLUTION_DB_PASSWORD no .env}
    volumes:
      - ./docker/volumes/evolution_mysql_data:/var/lib/mysql
    networks:
      - evolution_network
    # Senha via interpolação do Compose (mesmo valor que MYSQL_ROOT_PASSWORD); CMD exec é estável.
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${EVOLUTION_DB_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 90s
    command: --default-authentication-plugin=mysql_native_password

  evolution_redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./docker/volumes/evolution_redis_data:/data
    networks:
      - evolution_network

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    ports:
      - "${EVOLUTION_HTTP_PORT:-8084}:8080"
    volumes:
      - ./docker/volumes/evolution_instances:/evolution/instances
    networks:
      - evolution_network
    depends_on:
      evolution_mysql:
        condition: service_healthy
      evolution_redis:
        condition: service_started
    environment:
      SERVER_PORT: "8080"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: mysql
      DATABASE_CONNECTION_URI: mysql://${EVOLUTION_DB_USER:-evolution}:${EVOLUTION_DB_PASSWORD:?Defina EVOLUTION_DB_PASSWORD no .env}@evolution_mysql:3306/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution_redis:6379
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-evolution_secret_key}
      LOG_LEVEL: ERROR,WARN,INFO
      DATABASE_SAVE_IS_ON_WHATSAPP: false

networks:
  evolution_network:
    driver: bridge
